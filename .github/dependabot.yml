version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its ref is a Rust version or channel (@1.89 is the MSRV, @stable),
      # not an action version, so Dependabot "updates" are always wrong.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
