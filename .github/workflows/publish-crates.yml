# Publish the crate to crates.io. Called by release.yml (generated by dist)
# after all binaries are built, via `publish-jobs` in dist-workspace.toml.
#
# Uses crates.io trusted publishing: no stored token. The crates.io config
# names the *calling* workflow (release.yml) and the `release` environment,
# which only v* tags may use.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
